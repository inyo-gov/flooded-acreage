<!-- Subtle flying ducks (background). Respects prefers-reduced-motion. -->
<style>
  /* Fallback if external stylesheet fails to load on GitHub Pages */
  #title-block-header.quarto-title-block { display: none !important; }
  .stat-chunk,
  .stat-chunk .cell-output-display {
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }
</style>
<script>
(function () {
  function injectDucks() {
    if (document.getElementById("bwma-duck-sky")) return;
    var sky = document.createElement("div");
    sky.id = "bwma-duck-sky";
    sky.setAttribute("aria-hidden", "true");
    sky.setAttribute("role", "presentation");

    // Simple side-view flying duck silhouette (inline SVG, currentColor).
    var duckSvg =
      '<svg viewBox="0 0 72 28" xmlns="http://www.w3.org/2000/svg" focusable="false">' +
      '<path fill="currentColor" d="M2 17c3-1 6-2 9-1 1-4 4-7 8-8 2-1 4 0 5 2l1 2c2-1 4-1 6 0 3 1 5 3 6 5h2c5 0 10 1 14 3-3 1-7 1-11 1-1 2-3 3-6 3-3 0-5-1-7-3-2 1-5 1-8 0-1 1-3 2-5 2-4 0-7-2-8-4-2 0-4 0-6-1v-1z"/>' +
      '<path fill="currentColor" d="M46 12c3-3 7-4 11-3 1 2 0 4-2 5-3 0-6 0-9-2z"/>' +
      '</svg>';

    var flock = [
      { top: "12%", size: "22px", opacity: "0.10", dur: "78s", delay: "0s" },
      { top: "22%", size: "30px", opacity: "0.13", dur: "64s", delay: "-18s" },
      { top: "38%", size: "18px", opacity: "0.09", dur: "88s", delay: "-40s" },
      { top: "58%", size: "26px", opacity: "0.11", dur: "70s", delay: "-8s" },
      { top: "74%", size: "20px", opacity: "0.08", dur: "96s", delay: "-55s" }
    ];

    flock.forEach(function (d) {
      var el = document.createElement("div");
      el.className = "bwma-duck";
      el.style.top = d.top;
      el.style.setProperty("--duck-size", d.size);
      el.style.setProperty("--duck-opacity", d.opacity);
      el.style.setProperty("--duck-dur", d.dur);
      el.style.setProperty("--duck-delay", d.delay);
      el.innerHTML = duckSvg;
      sky.appendChild(el);
    });

    document.body.prepend(sky);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", injectDucks);
  } else {
    injectDucks();
  }
})();
</script>
